[project]
name = "bharat-mcp-backend"
version = "0.1.0"
description = "Bharat MCP — core MCP server, admin API and OAuth 2.1 connector layer"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

# PRD §4.1. Versions are minimum floors; uv.lock pins exact versions with hashes.
dependencies = [
    # ── Web / ASGI ────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "jinja2>=3.1",                    # consent + OTP pages only, autoescape on
    # ── Schemas / settings (the single source of truth, §6.5) ─────────────────
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # ── Persistence ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.1",
    # ── MCP protocol (never hand-rolled, §10.1 PW.4) ──────────────────────────
    "mcp>=1.9",
    # ── Background jobs ───────────────────────────────────────────────────────
    "arq>=0.26",
    # ── OAuth 2.1 AS / crypto (never hand-rolled, §10.1 PW.4) ─────────────────
    "authlib>=1.3",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",             # AES-256-GCM for contact-at-rest, §6.2 crypto.py
    # ── External I/O (importable only inside app/integrations/, rule A4) ──────
    "httpx>=0.27",
    "tenacity>=9.0",
    "aioboto3>=13.2",
    # ── Domain helpers ────────────────────────────────────────────────────────
    "phonenumbers>=8.13",             # E.164 normalisation
    "pillow>=11.0",                   # magic-byte validation + EXIF-stripping re-encode
    # ── Observability ─────────────────────────────────────────────────────────
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.17",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[dependency-groups]
# PRD §4.2. Installed via `uv sync --all-groups`.
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.7",
    "semgrep>=1.95",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "types-aioboto3>=13.2",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.6",
    "testcontainers[postgres,redis]>=4.8",   # real Postgres 16 + Redis 7; SQLite is banned
    "hypothesis>=6.115",
    "schemathesis>=3.38",
    "polyfactory>=2.18",
    "time-machine>=2.16",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.3"
asyncio_mode = "strict"                  # §4.2 — no implicit event-loop magic
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-p", "no:randomly",
]
markers = [
    "unit: pure domain logic, fakes only, no I/O",
    "integration: requires real Postgres and Redis via testcontainers",
    "contract: schema / adapter contract assertions",
    "security: blocking security assertions (§11.2)",
    "architecture: import-graph rules A1-A4",
    "e2e: full journey against a running stack",
    "slow: excluded from the fast local loop",
]
filterwarnings = ["error"]               # a warning we have not triaged fails the build

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py", "*/migrations/*"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.coverage.paths]
source = ["app", "*/app"]
