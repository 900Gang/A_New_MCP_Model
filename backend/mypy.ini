; PRD §4.2 — mypy --strict. Zero Any in app/.
[mypy]
python_version = 3.12
files = app, tests, scripts
plugins = pydantic.mypy

strict = True
; strict implies: disallow_untyped_defs, disallow_any_generics, disallow_untyped_calls,
; disallow_incomplete_defs, check_untyped_defs, disallow_untyped_decorators,
; no_implicit_optional, warn_redundant_casts, warn_unused_ignores, warn_return_any,
; strict_equality, extra_checks.

; Beyond strict:
warn_unreachable = True
disallow_any_explicit = True
disallow_any_unimported = True
no_implicit_reexport = True
show_error_codes = True
show_column_numbers = True
pretty = True
namespace_packages = True
explicit_package_bases = True

[pydantic-mypy]
init_typed = True
init_forbid_extra = True
warn_required_dynamic_aliases = True

; ── Test code may use explicit Any in fakes and factories ─────────────────────
[mypy-tests.*]
disallow_any_explicit = False

; ── Alembic autogenerate output is machine-written ────────────────────────────
[mypy-alembic.versions.*]
ignore_errors = True

; ── Third-party packages shipping no type information ─────────────────────────
[mypy-authlib.*]
ignore_missing_imports = True

[mypy-arq.*]
ignore_missing_imports = True

[mypy-phonenumbers.*]
ignore_missing_imports = True

[mypy-testcontainers.*]
ignore_missing_imports = True
